add_item:
  fields:
    name:
      example: Restje lasagne
      selector:
        text:
    contents:
      example: lasagne met gehakt
      selector:
        text:
    location:
      description: "Storage location ID (shown in Manage locations). Defaults to the first active location."
      example: fridge
      selector:
        text:
    added_date:
      selector:
        text:
    date_type:
      name: Date type
      description: "Use By for expiry dates, or Best Before for quality dates. Defaults to the template's date type."
      selector:
        select:
          options:
            - label: Use By
              value: use_by
            - label: Best Before
              value: best_before
    expiry_date:
      selector:
        text:
    quantity:
      example: 2 bakjes
      selector:
        text:
    portions:
      example: 3
      selector:
        number:
          min: 1
          max: 24
          mode: box

update_item:
  fields:
    date_type:
      name: Date type
      description: "Use By for expiry dates, or Best Before for quality dates. Defaults to the template's date type."
      selector:
        select:
          options:
            - label: Use By
              value: use_by
            - label: Best Before
              value: best_before
    id:
      required: true
      selector:
        text:

remove_item:
  fields:
    id:
      required: true
      selector:
        text:

complete_item:
  fields:
    id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - eaten
            - tossed
          translation_key: complete_action

eat_portion:
  fields:
    id:
      selector:
        text:
    code:
      example: AB12-2
      selector:
        text:
    portion:
      selector:
        number:
          min: 1
          max: 24
          mode: box
    action:
      selector:
        select:
          options:
            - eaten
            - tossed
          translation_key: complete_action

remove_expired:

estimate:
  fields:
    name:
      required: true
      example: krop sla
      selector:
        text:

add_template:
  fields:
    name:
      required: true
      selector:
        text:

print_sticker:
  fields:
    id:
      required: true
      selector:
        text:
    printer:
      required: false
      selector:
        text:

run_check:
